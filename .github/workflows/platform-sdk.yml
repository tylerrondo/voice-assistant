name: Platform SDK Build

on:
  push:
    branches: [integration/taxi-voice-sdk]
    paths:
      - 'packages/platform-runtime/**'
      - 'src/platform/dialogue-manager.ts'
      - 'src/platform/voice-channel.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/sdk/**'
      - '.github/workflows/platform-sdk.yml'
  pull_request:
    paths:
      - 'packages/platform-runtime/**'
      - 'src/platform/dialogue-manager.ts'
      - 'src/platform/voice-channel.ts'
      - 'package.json'
      - 'tests/sdk/**'
      - '.github/workflows/platform-sdk.yml'

permissions:
  contents: write

jobs:
  build-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run build:platform-runtime
      - run: npm run build:voice
      - run: node tests/sdk/platform-runtime-smoke.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/contract/scenarios/passenger-order.spec.ts
      - name: Commit distributable runtime output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f packages/platform-runtime/dist packages/voice/dist
          if ! git diff --cached --quiet; then
            git commit -m "build(sdk): publish compiled platform runtime [skip ci]"
            git push
          fi
