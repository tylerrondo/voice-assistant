name: Focused Tests 31-50

on:
  push:
    branches: [sc-integration-005]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  focused-e2e-31-50:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Recheck 3 failures from tests 31-50
        run: >-
          npx playwright test
          tests/e2e/platform/multi-context-session.spec.ts
          tests/e2e/platform/production-pipeline.spec.ts
          tests/e2e/scenarios/sc-002-taxi-driver.spec.ts
          tests/e2e/scenarios/passenger-order.spec.ts
          tests/e2e/scenarios/sc-003-taxi-driver-trip.spec.ts
          --grep "MULTICONTEXT-E2E-06|PIPELINE-E2E-06|E2E-PASS-001"
