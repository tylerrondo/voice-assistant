name: Focused Tests 41-60

on:
  push:
    branches: [sc-integration-005]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  focused-e2e-41-60:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run tests 41-56 from the d476afc failure sequence
        run: >-
          npx playwright test
          tests/e2e/platform/production-pipeline.spec.ts
          tests/e2e/sc-001-vegetable-stall.spec.ts
          tests/e2e/scenarios/passenger-offers.spec.ts
          tests/e2e/scenarios/passenger-order.spec.ts
          tests/e2e/scenarios/sc-004-taxi-driver-dialogue.spec.ts
          --grep "PIPELINE-E2E-03|PIPELINE-E2E-04|PIPELINE-E2E-05|PIPELINE-E2E-06|CONTRACT-06|CONTRACT-07|RUNTIME-E2E-01|E2E-PASS-002|E2E-PASS-001|DIALOGUE-E2E-01|DIALOGUE-E2E-02|NEG-02|NEG-03|NEG-04|RECOVERY-01|E2E-IDEMP-01"
      - name: Run tests 57-60 from the d476afc failure sequence
        run: >-
          npx playwright test
          tests/e2e/scenarios/sc-005-taxi-driver-full-trip.spec.ts
          --grep "WORKFLOW-01|NEG-01|NEG-02|NEG-03"
