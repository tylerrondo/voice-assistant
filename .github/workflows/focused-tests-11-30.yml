name: Focused Tests 11-30

on:
  push:
    branches: [sc-integration-005]

jobs:
  focused-e2e-11-30:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run tests 11-30 (20 tests)
        run: >
          npx playwright test
          tests/e2e/platform/context-ownership.spec.ts
          tests/e2e/platform/dialogue-state.spec.ts
          tests/e2e/platform/intent-resolution.spec.ts
