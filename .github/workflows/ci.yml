name: Voice Platform CI Pipeline

on:
  push:
    branches: [ master, main, 'work/**', 'fix/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: voice-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Build, Contract & E2E Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: http://localhost:3000
      VITE_E2E_AUTH: 'true'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Application
        run: npm run build

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Contract Tests
        run: npx playwright test tests/contract

      - name: Run Production E2E Tests
        run: npx playwright test tests/e2e

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
